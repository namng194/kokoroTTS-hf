name: HF Space check

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.hf"
      - "requirements-hf.txt"
      - "spaces/**"
      - "scripts/deploy_hf_space.py"
      - "tests/test_hf_space.py"
      - ".github/workflows/hf-space-check.yml"
  pull_request:
    paths:
      - "Dockerfile.hf"
      - "requirements-hf.txt"
      - "spaces/**"
      - "scripts/deploy_hf_space.py"
      - "tests/test_hf_space.py"
      - ".github/workflows/hf-space-check.yml"
  workflow_dispatch:

jobs:
  hf-space-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Static HF Space checks (no GPU, no model downloads)
        run: python -m unittest tests.test_hf_space -v

      - name: Deploy helper dry-run (docker flavour)
        run: python scripts/deploy_hf_space.py --flavour docker --space-id local/kokorotts-hf --dry-run

      - name: Deploy helper dry-run (gradio flavour)
        run: python scripts/deploy_hf_space.py --flavour gradio --space-id local/kokorotts-hf-demo --dry-run

      - name: Fail if a real token was accidentally committed
        run: |
          set -euo pipefail
          # Scan tracked files only; allow the placeholder names HF_TOKEN/GH_TOKEN.
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|hf_[A-Za-z0-9]{20,}' -- . ':!*.lock' | grep -v 'HF_TOKEN' | grep -v 'GH_TOKEN' | grep -v 'GH_PAT'; then
            echo 'Possible committed secret found.' >&2
            exit 1
          fi
          echo 'No committed secrets detected.'
